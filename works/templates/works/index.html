{% extends 'base.html' %}

{% block title %}取り組み | HirahiraRoom{% endblock %}

{% block header %}
<header style="background-color: #2c5aa0;">
    <div class="container px-5 py-4">
        <div class="text-center text-white">
            <h1 class="h2 fw-bold mb-2">取り組み</h1>
            <p class="mb-0">{{ vision }}</p>
        </div>
    </div>
</header>
{% endblock %}

{% block contents %}
<div class="container px-5 py-5">
    <div class="list-group">
        <!-- 社内活動 3つの構想 -->
        <div class="list-group-item list-group-item-action">
            <h5 class="mb-2">
                <i class="fas fa-lightbulb me-2" style="color: #2c5aa0;"></i>
                社内活動 3つの構想
            </h5>
            <p class="mb-2 text-muted">人と会社と社会をつなぐ、3つの構想</p>
            <div class="mt-2">
                <a href="{% url 'proposals:index' %}" target="_blank" rel="noopener noreferrer" aria-label="社内活動 3つの構想（別タブで開きます）" class="btn btn-sm btn-outline-primary">開く</a>
            </div>
        </div>

        <!-- SE／PGの賃金と仕事の実質 -->
        <div class="list-group-item list-group-item-action">
            <h5 class="mb-2">
                <i class="fas fa-yen-sign me-2" style="color: #2c5aa0;"></i>
                SE／PGの賃金と仕事の実質
            </h5>
            <p class="mb-2 text-muted">給与を規定するもの、エンジニアが問い続けるべきこと（第1弾）</p>
            <div class="mt-2">
                <a href="{% url 'wages:index' %}" target="_blank" rel="noopener noreferrer" aria-label="SE／PGの賃金と仕事の実質（別タブで開きます）" class="btn btn-sm btn-outline-primary">開く</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
