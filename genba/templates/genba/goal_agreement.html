{% extends 'genba/base.html' %}

{% block genba_title %}到達の合意{% endblock %}

{% block genba_contents %}
<p class="small mb-1"><a href="{% url 'genba:management' %}">マネジメント</a></p>
<h2 class="h5 mb-1" style="color: #2c5aa0;">到達の合意：{{ goal.author.username }} さん</h2>
<p class="small text-muted">本人から依頼された到達の説明です。記録の原文は読めません（証拠は名前だけ）。合意した到達だけが、組織のスキル分布に匿名で入ります。</p>
<pre class="card card-body small genba-pre">{{ paste }}</pre>
<form method="post" class="card"><div class="card-body">
    {% csrf_token %}
    <label class="form-label small" for="comment">コメント（本人に見えます）</label>
    <textarea class="form-control mb-2" id="comment" name="comment" rows="3">{{ goal.agreement_comment }}</textarea>
    <button class="btn btn-primary btn-sm" name="action" value="agree">合意する</button>
    <button class="btn btn-outline-secondary btn-sm ms-1" name="action" value="return">差し戻す</button>
</div></form>
{% endblock %}
