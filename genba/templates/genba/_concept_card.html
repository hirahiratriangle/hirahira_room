<div class="slide-card{% if c.tone %} tone-{{ c.tone }}{% endif %}">
    {% if c.label %}<div class="slide-label">{{ c.label }}</div>{% endif %}
    {% if c.title %}<h3>{{ c.title }}</h3>{% endif %}
    {% if c.text %}<p>{{ c.text }}</p>{% endif %}
    {% if c.lines %}<ul>{% for line in c.lines %}<li>{{ line }}</li>{% endfor %}</ul>{% endif %}
    {% if c.sub %}<div class="slide-sub">{{ c.sub }}</div>{% endif %}
</div>
