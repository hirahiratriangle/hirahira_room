name: 基本情報の問題の X 投稿

# 定期の投稿は Azure Logic Apps（hirahira-fe-x-post）が日本時間の7時・12時・19時に起こす。
# GitHub Actions の定期実行は数時間遅れることがあったため、2026-10-30 にやめた。
# このワークフローは、失敗した枠を手で流し直すときだけに使う。
# 実際に投稿するのはサイト側（/fe/tasks/post-x/ → fe/x_post.py の post_slot）。
# 同じ日の同じ時間帯は1回しか投稿しないので、流し直してよい。
# 失敗した時間帯は、流し直すと同じ問題で投稿し直す。
on:
  workflow_dispatch:
    inputs:
      slot:
        description: 時間帯
        required: true
        type: choice
        options: [morning, noon, evening]
      date:
        description: 枠の日付（YYYY-MM-DD。空なら今日。夜の枠は0〜7時なら前の日）
        required: false
        type: string

permissions: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: X への投稿を起動する
        env:
          ENDPOINT: ${{ secrets.FE_X_URL }}
          TOKEN: ${{ secrets.FE_X_TOKEN }}
          SLOT: ${{ inputs.slot }}
          DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          if [ -z "${ENDPOINT}" ] || [ -z "${TOKEN}" ]; then
            echo "FE_X_URL と FE_X_TOKEN を Secrets に設定してください。" >&2
            exit 1
          fi
          curl --silent --show-error --fail-with-body \
               --max-time 120 \
               --retry 3 --retry-delay 30 --retry-all-errors \
               -X POST "${ENDPOINT}" \
               -H "X-Fe-X-Token: ${TOKEN}" \
               --data-urlencode "slot=${SLOT}" \
               --data-urlencode "date=${DATE}"
          echo
