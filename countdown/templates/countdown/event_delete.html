{% extends 'base.html' %}
{% load static %}

{% block title %}削除 - カウントアップ＆ダウン | HirahiraRoom{% endblock %}

{% block header %}
<header style="background-color: #2c5aa0; padding-top: 5rem;">
    <div class="container px-5 py-4">
        <div class="text-center text-white">
            <h1 class="h3 fw-bold mb-0">削除の確認</h1>
        </div>
    </div>
</header>
{% endblock %}

{% block contents %}
<div class="container px-5 py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <p class="mb-1">以下のデータを削除します。よろしいですか？</p>
                    <h2 class="h5 mb-1">{{ object.name }}</h2>
                    <p class="text-muted small mb-3">{{ object.date|date:"Y年n月j日 (D)" }}</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-danger">削除する</button>
                            <a href="{% url 'countdown:event_list' %}" class="btn btn-outline-secondary">キャンセル</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
