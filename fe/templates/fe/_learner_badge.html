{% comment %}いまの ID と、ID を切り替える入口。ヘッダーの nav に並べる。
テキストのリンクに埋もれないよう、枠つきのボタンにする。
ID なしのときは何も出さない（ID を作る案内はダッシュボードの後半にある）。{% endcomment %}
{% if not request.fe_learner.is_temporary %}
<span class="d-inline-flex align-items-center gap-2">
    <span style="color:#c3d6ee;">ID: <strong class="text-white">{{ request.fe_learner.code }}</strong></span>
    <a class="btn btn-outline-light btn-sm py-0" href="{% url 'fe:mypage' %}?switch">ID を切り替える</a>
</span>
{% endif %}
