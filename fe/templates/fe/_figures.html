{% comment %}
問題文の図。公開問題の冊子から切り出した PNG を data URI で持っている。
冊子は白地に黒なので、暗い画面でも白地のまま見せる（反転すると図が読めない）。
{% endcomment %}
{% for figure in figures %}
<figure class="mt-3 mb-0">
    <img src="{{ figure.src }}" alt="{{ figure.alt }}" class="img-fluid border rounded bg-white p-2" loading="lazy">
</figure>
{% endfor %}
